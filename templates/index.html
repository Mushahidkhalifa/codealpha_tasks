
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink - URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4ff;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #20205015;
            width: min(420px, 82vw);
            text-align: center;
        }

        h1 { color: #4f46e5; }
        p { color: #666; }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 12px 0;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .result, .error {
            overflow-wrap: anywhere;
            margin-top: 20px;
        }

        .result a { color: #4f46e5; }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
    <main class="container">
        <h1>QuickLink</h1>
        <p>Turn long links into short links.</p>

        <form method="POST">
            <input
                type="url"
                name="url"
                placeholder="https://example.com/your-long-link"
                required
            >
            <button type="submit">Shorten URL</button>
        </form>

        {% if short_url %}
            <div class="result">
                <p>Your short URL:</p>
                <a href="{{ short_url }}" id="shortUrlLink"
   data-short-url="{{ short_url }}">
                    {{ short_url }}
                </a>
                <p>
                    <button type="button" id="copyButton">
                        Copy link
                    </button>
                </p>
            </div>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </main>   

{% if short_url %}
<script>
    const copyButton = document.getElementById("copyButton");
    const shortUrl = document.getElementById("shortUrlLink").dataset.shortUrl;

    copyButton.addEventListener("click", async function () {
        try {
            await navigator.clipboard.writeText(shortUrl);
            copyButton.textContent = "Copied!";
        } catch (error) {
            console.error("Failed to copy URL:", error);
            alert("Unable to copy automatically. Please copy this URL: " + shortUrl);
        }
    });
</script>
{% endif %}

</body>
</html>
